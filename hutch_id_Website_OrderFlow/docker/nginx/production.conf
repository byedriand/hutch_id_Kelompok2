# ============================================================
# docker/nginx/production.conf — Hutch.id Production Nginx (HTTP-only)
# Domain   : hutch-prestige.my.id
# Note     : Port 80 di container dimap ke port 8090 di host.
#            SSL dan traffic port 80/443 utama ditangani oleh simhpsb_nginx.
# ============================================================

server {
    listen 80;
    server_name hutch-prestige.my.id www.hutch-prestige.my.id;

    root  /var/www/html/public;
    index index.php index.html;

    # ── Upload size (foto produk dari kamera HP) ──────────────────────────
    client_max_body_size 15M;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── GZIP Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/x-javascript text/xml
        application/xml application/xml+rss
        image/svg+xml font/ttf font/otf
        font/woff font/woff2;

    # ── Static asset caching ──────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, no-transform";
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Main routing (Laravel) ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────
    location ~ \.php$ {
        include         fastcgi_params;
        fastcgi_pass    hutch_app:9000;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index   index.php;
        fastcgi_read_timeout    300;
        fastcgi_buffer_size     128k;
        fastcgi_buffers         4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Block .htaccess ───────────────────────────────────────────────────
    location ~ /\.ht {
        deny all;
    }

    # ── Block hidden files ────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
