services:
    app:
        build: .
        volumes:
            - ./:/var/www/html
        depends_on:
            - db
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:delegated
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - app-network

    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: hutch
            MYSQL_USER: hutch
            MYSQL_PASSWORD: secret
        ports:
            - "3307:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - app-network

    n8n:
        image: n8nio/n8n:latest
        environment:
            - N8N_BASIC_AUTH_ACTIVE=true
            - N8N_BASIC_AUTH_USER=admin
            - N8N_BASIC_AUTH_PASSWORD=admin
            - DB_TYPE=sqlite
            - DB_SQLITE_VACUUM_ON_STARTUP=true
            - N8N_HOST=0.0.0.0
            - N8N_PORT=5678
        ports:
            - "5678:5678"
        volumes:
            - ./n8n:/home/node/.n8n
        networks:
            - app-network

volumes:
    dbdata:

networks:
    app-network:
        driver: bridge
