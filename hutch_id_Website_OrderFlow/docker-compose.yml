services:
    app:
        build: .
        env_file:
            - .env.docker
        ports:
            - "8081:80"
        volumes:
            - ./:/var/www/html
        depends_on:
            - db
        networks:
            - app-network
        labels:
            - "com.docker.desktop.extension.api.version=1"
            - "com.hutch.app=web"

    app-web:
        image: nginx:alpine
        ports:
            - "8082:80"
        volumes:
            - ./:/var/www/html:delegated
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - app-network
        labels:
            - "com.docker.desktop.extension.api.version=1"

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:delegated
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - app-network

    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: hutch
            MYSQL_USER: hutch
            MYSQL_PASSWORD: secret
        ports:
            - "3307:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - app-network

    n8n:
        image: n8nio/n8n:latest
        environment:
            - N8N_BASIC_AUTH_ACTIVE=true
            - N8N_BASIC_AUTH_USER=adrianronald99@gmail.com
            - N8N_BASIC_AUTH_PASSWORD=Drian11099
            - DB_TYPE=sqlite
            - DB_SQLITE_VACUUM_ON_STARTUP=true
            - N8N_HOST=${NGROK_DOMAIN}
            - N8N_PORT=5678
            - N8N_PROTOCOL=https
            - WEBHOOK_URL=https://henna-empty-plywood.ngrok-free.dev/webhook/hutch-chatbot/webhook/hutch-chatbot
            - N8N_EDITOR_BASE_URL=https://henna-empty-plywood.ngrok-free.dev/webhook/hutch-chatbot/webhook/hutch-chatbot
        ports:
            - "5678:5678"
        volumes:
            - ./n8n:/home/node/.n8n
        networks:
            - app-network

volumes:
    dbdata:

networks:
    app-network:
        driver: bridge
