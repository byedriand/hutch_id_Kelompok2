name: hutch_mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  flutter_inappwebview: ^6.2.0-beta.3
  url_launcher: ^6.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "public/images/hutch-logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/website/