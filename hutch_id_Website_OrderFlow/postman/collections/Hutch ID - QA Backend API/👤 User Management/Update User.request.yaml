$kind: http-request
description: Update email dan role user.
url: "{{base_url}}/users/{{created_user_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "qa_staff_updated@hutch.id",
        "role": "operator_gudang"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('User updated successfully', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.email).to.eql('qa_staff_updated@hutch.id');
          pm.expect(json.data.role).to.eql('operator_gudang');
      });
    language: text/javascript
order: 5000
