$kind: http-request
description: Test buat user dengan role yang tidak valid.
url: "{{base_url}}/users"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "invalid_role@hutch.id",
        "role": "super_admin",
        "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 422', function () {
          pm.response.to.have.status(422);
      });

      pm.test('Invalid role error', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(false);
      });
    language: text/javascript
order: 4000
