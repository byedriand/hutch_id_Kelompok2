$kind: http-request
description: Ambil detail pelanggan berdasarkan ID.
url: "{{base_url}}/pelanggan/{{created_pelanggan_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Pelanggan data returned', function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('id');
          pm.expect(json).to.have.property('nama');
          pm.expect(json).to.have.property('alamat');
          pm.expect(json).to.have.property('telepon');
      });
    language: text/javascript
order: 5000
