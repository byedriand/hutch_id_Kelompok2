$kind: http-request
description: Ambil semua notifikasi untuk role user saat ini.
url: "{{base_url}}/notifikasi"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response is an array', function () {
          var json = pm.response.json();
          pm.expect(json).to.be.an('array');
      });

      pm.test('Save notifikasi ID for later tests', function () {
          var json = pm.response.json();
          if (json.length > 0) {
              pm.environment.set('notifikasi_id', json[0].id);
              pm.expect(json[0]).to.have.property('id');
              pm.expect(json[0]).to.have.property('judul');
              pm.expect(json[0]).to.have.property('pesan');
              pm.expect(json[0]).to.have.property('tipe');
          }
      });
    language: text/javascript
order: 1000
