$kind: http-request
description: Ambil notifikasi dengan batas jumlah.
url: "{{base_url}}/notifikasi?limit=5"
method: GET
headers:
  Accept: application/json
queryParams:
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Results limited to 5', function () {
          var json = pm.response.json();
          pm.expect(json.length).to.be.at.most(5);
      });
    language: text/javascript
order: 3000
