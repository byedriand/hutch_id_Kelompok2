$kind: http-request
description: Ambil detail arsip pesanan.
url: "{{base_url}}/arsip-pdf/{{arsip_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Arsip detail returned', function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('id');
          pm.expect(json).to.have.property('nomor_po');
          pm.expect(json).to.have.property('status');
      });
    language: text/javascript
order: 3000
