$kind: http-request
name: Update Status - Dikonfirmasi
description: Update status pesanan dari menunggu_konfirmasi → dikonfirmasi.
url: "{{base_url}}/pesanan/15/status"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "status": "dikonfirmasi",
        "keterangan": "Dikonfirmasi via Postman QA"
    }
scripts:
  - type: afterResponse
    code: |-
      var code = pm.response.code;

      pm.test('Status code is 200 or 302 or 422', function () {
          pm.expect([200, 302, 422]).to.include(code);
      });

      if (code === 200) {
          pm.test('Status changed to dikonfirmasi', function () {
              var json = pm.response.json();
              pm.expect(json.success).to.eql(true);
          });
      }
    language: text/javascript
order: 9000
