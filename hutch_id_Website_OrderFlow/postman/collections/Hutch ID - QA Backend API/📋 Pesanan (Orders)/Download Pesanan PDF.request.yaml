$kind: http-request
description: Download PDF pesanan (base64 encoded).
url: "{{base_url}}/pesanan/{{pesanan_id}}/pdf"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('PDF data returned', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json).to.have.property('pdf');
          pm.expect(json).to.have.property('filename');
      });
    language: text/javascript
order: 13000
