$kind: http-request
description: Test transisi status yang tidak valid (skip step).
url: "{{base_url}}/pesanan/{{pesanan_id}}/status"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "status": "selesai",
        "keterangan": "Skip steps - should fail"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 422 or 403', function () {
          pm.expect([422, 403]).to.include(pm.response.code);
      });
    language: text/javascript
order: 12000
