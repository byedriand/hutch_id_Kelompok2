$kind: http-request
description: Cari pesanan berdasarkan nomor PO, nama pelanggan, atau nama produk.
url: "{{base_url}}/pesanan?cari=PO-"
method: GET
headers:
  Accept: application/json
queryParams:
  cari: PO-
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response is an array', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 3000
