$kind: http-request
description: Quick update stok tanpa keterangan (mobile app).
url: "{{base_url}}/produk/{{created_produk_id}}/stok-quick"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "stok": 50
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Quick stock update successful', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.produk).to.have.property('stok');
      });
    language: text/javascript
order: 8000
