$kind: http-request
description: Update stok produk dengan keterangan (operator gudang / admin).
url: "{{base_url}}/produk/{{created_produk_id}}/stok"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "stok": 100,
        "keterangan": "Update stok awal untuk QA testing"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Stock updated', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.new_stok).to.eql(100);
      });
    language: text/javascript
order: 7000
