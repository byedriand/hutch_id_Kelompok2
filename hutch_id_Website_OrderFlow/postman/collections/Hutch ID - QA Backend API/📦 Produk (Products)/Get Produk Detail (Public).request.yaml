$kind: http-request
description: Ambil detail satu produk berdasarkan ID.
url: "{{base_url}}/produk/{{produk_id}}"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Produk has complete fields', function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('id');
          pm.expect(json).to.have.property('nama');
          pm.expect(json).to.have.property('harga_jual');
          pm.expect(json).to.have.property('stok');
          pm.expect(json).to.have.property('keterangan');
      });
    language: text/javascript
order: 2000
