$kind: http-request
description: Hapus produk via API.
url: "{{base_url}}/produk/{{created_produk_id}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Produk deleted successfully', function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('message');
      });
    language: text/javascript
order: 9000
