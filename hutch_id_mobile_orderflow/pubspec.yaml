name: hutch_id_mobile_orderflow
description: "A new Flutter project."
publish_to: "none"

version: 1.0.2+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Icons
  font_awesome_flutter: ^10.7.0

  # HTTP and API
  http: ^1.1.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # State Management
  provider: ^6.0.0

  # Local Storage
  shared_preferences: ^2.2.0

  # Date & Time
  intl: ^0.19.0

  # Number Formatting
  currency_formatter: ^2.3.0

  # Image handling
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0

  # Dialog & Toast
  fluttertoast: ^8.2.0

  # Loading
  shimmer: ^3.0.0

  # URL Launcher
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/team/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/hutch-logo.png"