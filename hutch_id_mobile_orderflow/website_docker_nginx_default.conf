server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Tanpa ini, Nginx menolak upload di atas 1MB sebelum sempat
    # diteruskan ke PHP/Laravel.
    client_max_body_size 15M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Wajib untuk Flutter Web (CanvasKit) yang memuat foto produk dari
    # origin/port berbeda (mis. app Flutter di :63xxx mengambil gambar dari
    # backend ini di :8082). Tanpa header CORS ini, Image.network() di
    # Flutter Web gagal decode gambar walau file-nya ada & status 200.
    # Native Android/iOS tidak terdampak (CORS hanya dicek oleh browser).
    location ~* \.(png|jpe?g|gif|webp|svg|ico)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    location ~ /\.ht {
        deny all;
    }
}
